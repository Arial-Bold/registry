name: Notify www of schema change

on:
  push:
    branches: [main]
    paths:
      - "manifest.schema.json"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WWW_DISPATCH_TOKEN }}
          repository: DolphinDepot/www
          event-type: schema-updated
