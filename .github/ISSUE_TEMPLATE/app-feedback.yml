name: Application feedback
description: Report installation or launch problems, or share feedback about an application's Dolphin Depot listing.
title: "[App feedback] "
body:
    - type: markdown
      attributes:
          value: |
              Use this form for problems downloading, installing, or launching an application from Dolphin Depot, or for feedback about its listing. Report bugs within a running application to its developer.
    - type: input
      id: application
      attributes:
          label: Application
          description: Application name or registry slug.
      validations:
          required: true
    - type: input
      id: version
      attributes:
          label: Version
          description: Which version did you use? If prefilled, check that it matches your version.
    - type: textarea
      id: feedback
      attributes:
          label: Feedback
          description: Describe the problem or suggestion related to the Dolphin Depot listing, download, installation, or launch. Report bugs within a running application to its developer.
      validations:
          required: true
    - type: textarea
      id: setup
      attributes:
          label: Hardware and setup
          description: For problems running the application, include your console, loader, storage device, and any relevant peripherals.
